<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FortuneMatch (포춘매치) - Behance Enterprise Case Study & UX/UI Architecture</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=20261030_ftmt_cosmic_luxury_v1">
</head>
<body>

  <!-- Ambient Cosmic Aura Layer -->
  <div class="cosmic-aura-layer" aria-hidden="true"></div>

  <!-- Floating Navigation & Master Control Dock (Bottom Fixed) -->
  <aside class="global-control-bar" aria-label="Deck Controls">
    <div class="dock-left">
      <span class="live-status-pill">
        <span class="status-dot"></span>
        Google Play 비공개 테스트 (출시 임박)
      </span>
      <span class="deck-title">FortuneMatch · Behance Case Study</span>
    </div>

    <div class="dock-center">
      <button class="nav-arrow-btn" id="btn-prev" title="이전 슬라이드 (←, ↑)" aria-label="Previous Slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="slide-counter" id="slide-counter">SLIDE <strong id="curr-num">01</strong> / 12</span>
      <button class="nav-arrow-btn" id="btn-next" title="다음 슬라이드 (→, ↓, Space)" aria-label="Next Slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="dock-right">
      <button class="btn-live-proto" id="btn-goto-proto" title="인터랙티브 60fps 프로토타입 새 창에서 열기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        60fps 프로토타입 체험 ↗
      </button>
      <a href="https://koyotejw-ux.github.io/smart-dca/portfolio/index.html" class="btn-icon" title="스마트 물타기 계산기 포트폴리오 바로가기" style="text-decoration: none; width: auto; padding: 0 14px; border-radius: 9999px; gap: 6px; font-size: 12px; font-weight: 700; color: #00D2FF; border-color: rgba(0, 210, 255, 0.4); background: rgba(10, 36, 64, 0.7);">
        📊 스마트 물타기 ↗
      </a>
      <button class="btn-icon" id="btn-fitscreen" title="화면 높이 맞춤 토글 (W)" aria-label="Toggle Fit Window">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-fullscreen" title="전체화면 (F)" aria-label="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <a href="FortuneMatch_Portfolio.pdf" download="FortuneMatch_Portfolio.pdf" target="_blank" class="btn-print" style="text-decoration: none;" title="12슬라이드 1920x1080 고해상도 포트폴리오 PDF 다운로드">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        포트폴리오 PDF 다운로드
      </a>
    </div>
  </aside>

  <!-- Right Slide Dot Navigation Rail -->
  <nav class="slide-nav-rail" id="nav-rail" aria-label="Slide Jump Dots"></nav>

  <!-- Keyboard Hint Floating Toast -->
  <div class="key-hint-pill" id="key-hint">
    <span>💡 방향키 <kbd>←</kbd> <kbd>→</kbd> 슬라이드 이동 · <kbd>W</kbd> 화면 높이 맞춤 · <kbd>F</kbd> 전체화면 · <kbd>P</kbd> 라이브 프로토타입</span>
  </div>

  <!-- Main Slide Stream -->
  <main class="deck-main-container" id="deck-container">
    <section class="slide-frame" id="slide-1" data-index="1" data-title="01. Hero Cover">
      <img src="behance_slides/slide_01.png" alt="Slide 01 - FortuneMatch Hero Cover" loading="eager" />
    </section>

    <section class="slide-frame" id="slide-2" data-index="2" data-title="02. Market & Problem">
      <img src="behance_slides/slide_02.png" alt="Slide 02 - Problem Definition & Market Study" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-3" data-index="3" data-title="03. Persona & Journey">
      <img src="behance_slides/slide_03.png" alt="Slide 03 - Target Persona & Journey Map" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-4" data-index="4" data-title="04. Architecture">
      <img src="behance_slides/slide_04.png" alt="Slide 04 - Information Architecture" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-5" data-index="5" data-title="05. User Flow">
      <img src="behance_slides/slide_05.png" alt="Slide 05 - User Flow & Experience Logic" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-6" data-index="6" data-title="06. Wireframe">
      <img src="behance_slides/slide_06.png" alt="Slide 06 - Wireframe & Interaction Callout Pins" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-7" data-index="7" data-title="07. Design System">
      <img src="behance_slides/slide_07.png" alt="Slide 07 - Visual Design System & Brand Tokens" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-8" data-index="8" data-title="08. Radar Feature">
      <img src="behance_slides/slide_08.png" alt="Slide 08 - Five Elements Interactive Radar" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-9" data-index="9" data-title="09. Match Engine">
      <img src="behance_slides/slide_09.png" alt="Slide 09 - Compatibility Match Engine" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-10" data-index="10" data-title="10. Mobile Screens">
      <img src="behance_slides/slide_10.png" alt="Slide 10 - High-Fidelity Mobile Screens Showcase" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-11" data-index="11" data-title="11. Business Impact">
      <img src="behance_slides/slide_11.png" alt="Slide 11 - Business Impact & STAR Retrospective" loading="lazy" />
    </section>

    <section class="slide-frame" id="slide-12" data-index="12" data-title="12. Interactive Hub" style="position: relative;">
      <img src="behance_slides/slide_12.png" alt="Slide 12 - Live Prototype Interactive Hub" loading="lazy" />
      <div class="slide12-click-overlay" id="overlay-slide12" title="클릭하여 60fps 인터랙티브 프로토타입 새 창 실행"></div>
    </section>
  </main>

  <script>
    (function() {
      const slides = Array.from(document.querySelectorAll('.slide-frame'));
      const totalSlides = slides.length;
      const currNumEl = document.getElementById('curr-num');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnFitscreen = document.getElementById('btn-fitscreen');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const btnGotoProto = document.getElementById('btn-goto-proto');
      const navRail = document.getElementById('nav-rail');
      const keyHint = document.getElementById('key-hint');
      const overlaySlide12 = document.getElementById('overlay-slide12');
      let currentIndex = 0;

      // Fit Screen Toggle Function (W)
      function toggleFitScreen() {
        const isFit = document.body.classList.toggle('fit-window');
        if (btnFitscreen) {
          btnFitscreen.classList.toggle('active', isFit);
        }
        setTimeout(() => scrollToSlide(currentIndex), 100);
      }
      if (btnFitscreen) {
        btnFitscreen.addEventListener('click', toggleFitScreen);
      }

      // Goto Prototype Button (Opens in new window/tab)
      if (btnGotoProto) {
        btnGotoProto.addEventListener('click', () => {
          window.open('prototype.html', '_blank');
        });
      }

      if (overlaySlide12) {
        overlaySlide12.addEventListener('click', () => {
          window.open('prototype.html', '_blank');
        });
      }

      // 1. Build Dot Navigation Rail with Tooltips
      slides.forEach((slide, idx) => {
        const dotItem = document.createElement('div');
        dotItem.className = 'rail-item' + (idx === 0 ? ' active' : '');
        dotItem.setAttribute('data-index', idx);
        dotItem.setAttribute('role', 'button');
        dotItem.setAttribute('aria-label', `Slide ${idx + 1}`);

        const dot = document.createElement('div');
        dot.className = 'rail-dot';

        const tooltip = document.createElement('div');
        tooltip.className = 'rail-tooltip';
        tooltip.textContent = slide.getAttribute('data-title') || `Slide ${idx + 1}`;

        dotItem.appendChild(tooltip);
        dotItem.appendChild(dot);

        dotItem.addEventListener('click', () => {
          scrollToSlide(idx);
        });

        navRail.appendChild(dotItem);
      });

      const railDots = Array.from(document.querySelectorAll('.rail-item'));

      function updateActiveState(idx) {
        if (idx === currentIndex) return;
        currentIndex = idx;
        const formatted = String(currentIndex + 1).padStart(2, '0');
        currNumEl.textContent = formatted;

        railDots.forEach((dot, i) => {
          dot.classList.toggle('active', i === currentIndex);
        });
      }

      function scrollToSlide(idx) {
        if (idx < 0 || idx >= totalSlides) return;
        slides[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      // 2. IntersectionObserver for Active Slide Tracking
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
            const index = slides.indexOf(entry.target);
            if (index !== -1) {
              updateActiveState(index);
            }
          }
        });
      }, {
        threshold: 0.5
      });

      slides.forEach(slide => observer.observe(slide));

      // 3. Arrow Controls
      btnPrev.addEventListener('click', () => {
        if (currentIndex > 0) scrollToSlide(currentIndex - 1);
      });

      btnNext.addEventListener('click', () => {
        if (currentIndex < totalSlides - 1) scrollToSlide(currentIndex + 1);
      });

      // 4. Keyboard Navigation
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) {
          e.preventDefault();
          if (currentIndex < totalSlides - 1) scrollToSlide(currentIndex + 1);
        } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) {
          e.preventDefault();
          if (currentIndex > 0) scrollToSlide(currentIndex - 1);
        } else if (e.key === 'Home') {
          e.preventDefault();
          scrollToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          scrollToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          if (!e.metaKey && !e.ctrlKey) {
            toggleFullscreen();
          }
        } else if (e.key === 'w' || e.key === 'W') {
          if (!e.metaKey && !e.ctrlKey) {
            toggleFitScreen();
          }
        } else if (e.key === 'p' || e.key === 'P') {
          window.open('prototype.html', '_blank');
        }
      });

      // 5. Fullscreen Toggle
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      btnFullscreen.addEventListener('click', toggleFullscreen);

      // 6. Dismiss key hint after 5.5s
      setTimeout(() => {
        if (keyHint) {
          keyHint.style.opacity = '0';
          setTimeout(() => keyHint.remove(), 600);
        }
      }, 5500);
    })();
  </script>
</body>
</html>
