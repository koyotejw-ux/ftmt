<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070A12">
  <title>FortuneMatch (포춘매치) - 60fps Live Interactive Simulator</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --device-scale: 1;
      --gold-champagne: #E5C07B;
      --gold-bright: #FFD700;
      --gold-gradient: linear-gradient(135deg, #FFD700 0%, #E5C07B 50%, #C69C53 100%);
      --bg-deep: #070A12;
      --bg-surface: #0E1424;
      --bg-card: #151C33;
      --bg-card-hover: #1C2646;
      --cyan-neon: #00E5FF;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --violet-aurora: #8A2BE2;
      --magenta-stardust: #FF007F;
      --text-primary: #F4F6FC;
      --text-secondary: #A3B0CC;
      --text-muted: #677598;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #12182e 0%, #070a12 60%, #030408 100%);
      color: var(--text-primary);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Floating Glassmorphism Navigation Bar */
    .proto-navbar {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(14, 20, 36, 0.88);
      border-bottom: 1px solid rgba(229, 192, 123, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      flex-shrink: 0;
    }

    .proto-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back-deck {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(229, 192, 123, 0.3);
      color: var(--gold-champagne);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-deck:hover {
      background: rgba(229, 192, 123, 0.15);
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      transform: translateX(-2px);
    }

    .proto-brand {
      font-size: 14px;
      font-weight: 800;
      color: #A3B0CC;
      letter-spacing: -0.01em;
    }

    .proto-brand strong {
      color: var(--gold-bright);
    }

    /* Center Flow Switcher Pills */
    .flow-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 6px;
      border-radius: 9999px;
      border: 1px solid rgba(229, 192, 123, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .flow-pill-btn {
      background: transparent;
      border: none;
      color: #A3B0CC;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flow-pill-btn span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      font-size: 10px;
      font-weight: 800;
      color: inherit;
    }

    .flow-pill-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .flow-pill-btn.active {
      background: linear-gradient(135deg, #FFD700 0%, #E5C07B 100%);
      color: #070A12;
      box-shadow: 0 2px 14px rgba(255, 215, 0, 0.45);
      font-weight: 800;
    }

    .flow-pill-btn.active span {
      background: #070A12;
      color: #FFD700;
    }

    .proto-nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fps-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34D399;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    .fps-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-proto-pdf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      background: linear-gradient(135deg, #FFD700 0%, #E5C07B 100%);
      color: #070A12;
      font-size: 12px;
      font-weight: 800;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-proto-pdf:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.5);
      filter: brightness(1.08);
    }

    .btn-proto-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #A3B0CC;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-proto-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      transform: scale(1.05);
    }

    /* Device Stage */
    .device-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 12px 20px;
    }

    .device-scale-wrapper {
      transform: scale(var(--device-scale));
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* iPhone 16 Pro Flagship Frame */
    .iphone-device {
      width: 393px;
      height: 852px;
      background: #070A12;
      border-radius: 54px;
      box-shadow: 
        0 0 0 3px #182033,
        0 0 0 5px rgba(229, 192, 123, 0.65),
        0 25px 65px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(138, 43, 226, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Side Buttons Protrusion */
    .iphone-device::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 130px;
      width: 4px;
      height: 32px;
      background: #2D323C;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 45px 0 #2D323C, 0 95px 0 #2D323C;
    }

    .iphone-device::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 175px;
      width: 4px;
      height: 54px;
      background: #2D323C;
      border-radius: 0 2px 2px 0;
    }

    /* Authentic 44px iOS Status Bar */
    .iphone-status-bar {
      height: 44px;
      width: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      pointer-events: none;
    }

    .status-time {
      font-variant-numeric: tabular-nums;
      font-size: 14.5px;
      font-weight: 700;
      color: #F4F6FC;
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 34px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
    }

    .di-camera {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #0A0E18;
      border: 1px solid #1E293B;
      box-shadow: inset 0 0 3px rgba(0, 229, 255, 0.6);
    }

    .di-sensor {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111827;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #F4F6FC;
    }

    /* Simulator Content Screen */
    .simulator-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #070A12;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding-top: 44px;
      padding-bottom: 74px; /* Space for bottom nav */
      box-sizing: border-box;
      scrollbar-width: none;
    }

    .simulator-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Screen Views */
    .proto-screen {
      display: none;
      width: 100%;
      min-height: 100%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      padding: 12px 16px 24px;
    }

    .proto-screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Common App Header */
    .app-screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 4px 2px;
    }

    .app-brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold-champagne);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-brand-title span.tag-kr {
      font-size: 10px;
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--cyan-neon);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .app-heart-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.4);
      color: #FF5E97;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .app-heart-badge:hover {
      transform: scale(1.05);
    }

    /* Glass Cards */
    .app-card {
      background: var(--bg-surface);
      border: 1px solid rgba(229, 192, 123, 0.22);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(229, 192, 123, 0.5), transparent);
    }

    /* Flow 01: Orbit Compass Keyvisual */
    .orbit-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 0 20px;
      position: relative;
    }

    .orbit-wheel {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1px dashed rgba(229, 192, 123, 0.4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinOrbit 45s linear infinite;
      cursor: pointer;
      transition: transform 0.3s ease;
      box-shadow: 0 0 35px rgba(229, 192, 123, 0.15);
    }

    @keyframes spinOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-wheel:active {
      animation-duration: 8s;
    }

    .orbit-ring-middle {
      position: absolute;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .orbit-core {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle, #2A1B4E 0%, #0D1224 100%);
      border: 2px solid var(--gold-champagne);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      z-index: 5;
    }

    .orbit-core span.core-yin-yang {
      font-size: 18px;
      color: var(--gold-bright);
      line-height: 1;
    }

    .orbit-core span.core-tag {
      font-size: 10px;
      font-weight: 800;
      color: #A3B0CC;
      margin-top: 2px;
    }

    .orbit-stems {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stem-item {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      color: rgba(229, 192, 123, 0.9);
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    .orbit-hint {
      font-size: 11px;
      color: #A3B0CC;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* User Profile Card */
    .profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .profile-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8A2BE2 0%, #00E5FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.5);
    }

    .profile-name {
      font-size: 12px;
      color: #A3B0CC;
    }

    .profile-coord {
      font-size: 13.5px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .btn-edit-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Golden Time Secret Box */
    .golden-box {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(229, 192, 123, 0.04) 100%);
      border: 1px solid rgba(255, 215, 0, 0.35);
    }

    .card-label-gold {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-bright);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .golden-time-badge {
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .golden-time-badge span {
      color: var(--gold-bright);
    }

    .golden-desc {
      font-size: 12px;
      color: #CBD5E1;
      line-height: 1.5;
    }

    /* Action Buttons */
    .btn-gold-cta {
      width: 100%;
      background: linear-gradient(135deg, #FFD700 0%, #E5C07B 100%);
      color: #070A12;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.35);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-gold-cta:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-gold-cta:active {
      transform: scale(0.98);
    }

    /* Tabs Bar inside Mockup */
    .subtabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .subtabs-bar::-webkit-scrollbar { display: none; }

    .subtab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(229, 192, 123, 0.2);
      color: #A3B0CC;
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .subtab-btn.active {
      background: var(--gold-champagne);
      color: #070A12;
      border-color: var(--gold-bright);
      font-weight: 800;
    }

    /* Chemistry Circles */
    .chem-circles {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 10px 0 16px;
    }

    .chem-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .chem-circle.my-circle {
      background: radial-gradient(circle, #25143A 0%, #110B1C 100%);
      border: 2px solid #8A2BE2;
      box-shadow: 0 0 18px rgba(138, 43, 226, 0.45);
    }

    .chem-circle.target-circle {
      background: radial-gradient(circle, #0D2636 0%, #06121C 100%);
      border: 2px solid #00E5FF;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
    }

    .chem-spark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, #FFD700 0%, #302008 100%);
      border: 1px solid #FFD700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #070A12;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      animation: pulseSpark 2s infinite ease-in-out;
    }

    @keyframes pulseSpark {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
    }

    .circle-label {
      font-size: 10px;
      color: #A3B0CC;
    }

    .circle-val {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
    }

    /* Dropdowns */
    .input-group {
      margin-bottom: 10px;
    }

    .input-label {
      font-size: 11px;
      color: #A3B0CC;
      margin-bottom: 4px;
      display: block;
    }

    .proto-select {
      width: 100%;
      background: rgba(14, 20, 36, 0.9);
      border: 1px solid rgba(229, 192, 123, 0.3);
      color: #F4F6FC;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* SVG Radar Chart */
    .radar-chart-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }

    .radar-svg {
      width: 220px;
      height: 190px;
      overflow: visible;
    }

    .radar-axis-label {
      font-size: 10px;
      font-weight: 800;
      fill: #A3B0CC;
      text-anchor: middle;
    }

    .radar-polygon {
      fill: rgba(229, 192, 123, 0.3);
      stroke: #FFD700;
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.45));
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dynamic Score Meter */
    .score-meter-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin: 10px 0 6px;
    }

    .score-meter-bar {
      height: 100%;
      width: 96%;
      background: linear-gradient(90deg, #FF007F, #FFD700, #00E5FF);
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }

    /* 3D Dopamine Tarot Flip Card */
    .tarot-stage-wrap {
      perspective: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 18px;
    }

    .tarot-3d-card {
      width: 180px;
      height: 270px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);

      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      font-weight: 800;
      color: #FFFFFF;
    }

    .rune-desc {
      font-size: 11px;
      color: #94A3B8;
    }

    /* Persistent Phone Bottom Navigation */
    .phone-bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(7, 10, 18, 0.96);
      border-top: 1px solid rgba(229, 192, 123, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      align-items: center;
      justify-content: space-around;

      display: flex;
      flex-direction: column;
      align-items: center;

    }

      color: var(--gold-bright);
    }

    .bnav-item.active .bnav-icon {
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));

    /* Toast Notification */
    .proto-toast {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);

      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .proto-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);

    /* Responsive */

      .proto-navbar {

  <script>
    // Live Digital Clock in Status Bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const el = document.getElementById('statusClock');
      if (el) el.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Height-Adaptive Auto-Resizing Engine for Simulator
    function autoResizeMockup() {
      const stage = document.getElementById('deviceStage');
      const wrapper = document.getElementById('deviceWrapper');
      if (!stage || !wrapper) return;
      if (window.innerWidth <= 768) {
        document.documentElement.style.setProperty('--device-scale', '1');
        return;
      }
      const availableHeight = stage.clientHeight - 28;
      const baseHeight = 852;
      let scale = Math.min(1, availableHeight / baseHeight);
      if (scale < 0.45) scale = 0.45;
      document.documentElement.style.setProperty('--device-scale', scale);
    }

    window.addEventListener('resize', autoResizeMockup);
    window.addEventListener('DOMContentLoaded', autoResizeMockup);
    autoResizeMockup();

    // Global App State
    let heartsCount = 3;
    let isFlipped = false;

    // Toast Notification Engine
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('protoToast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    // =========================================================================
    // CORE FLOW SWITCHER (Header Pills & Bottom Nav Synced)
    // =========================================================================
    function switchFlow(flowName) {
      // 1. Update Top Pills
      document.querySelectorAll('.flow-pill-btn').forEach(b => b.classList.remove('active'));
      const activePill = document.getElementById('pill-' + flowName);
      if (activePill) activePill.classList.add('active');

      // 2. Map flow to Flutter Tab Index
      let tabIndex = 0;
      if (flowName === 'hub') tabIndex = 0;
      else if (flowName === 'radar' || flowName === 'match') tabIndex = 1;
      else if (flowName === 'tarot') tabIndex = 3;

      // 3. Command Flutter Web App via Direct Bridge & PostMessage
      const iframe = document.getElementById('protoIframe');
      if (iframe && iframe.contentWindow) {
        try {
          if (typeof iframe.contentWindow.switchTab === 'function') {
            iframe.contentWindow.switchTab(tabIndex);
          }
          iframe.contentWindow.postMessage({ type: 'SWITCH_TAB', index: tabIndex }, '*');
        } catch (e) {
          console.warn('Iframe communication:', e);
        }
      }

      // Play subtle feedback
      showToast('화면 전환: ' + getFlowTitle(flowName));
    }

    function getFlowTitle(name) {
      if (name === 'hub') return '01. 우주 사주 허브';
      if (name === 'radar') return '02. 오행 레이더 분석';
      if (name === 'match') return '03. 정밀 인연 궁합 매칭';
      if (name === 'tarot') return '04. 3D 도파민 타로 리포트';
      return name;
    }

    // Orbit Compass Wheel Fast Spin Interaction
    function spinCompassFast() {
      const wheel = document.getElementById('orbitWheel');
      if (!wheel) return;
      wheel.style.animationDuration = '3s';
      showToast('🌀 24절기 궤도 나침반이 실시간 정렬 중입니다.');
      setTimeout(() => {
        wheel.style.animationDuration = '45s';
      }, 3000);
    }

    // Daily Heart Claim
    function claimDailyHeart() {
      const btn = document.getElementById('btnClaimHeart');
      if (btn.dataset.claimed === 'true') {
        showToast('오늘 출석 보상을 이미 수령하셨습니다.');
        return;
      }
      heartsCount += 1;
      document.querySelectorAll('.heart-val-display').forEach(el => el.textContent = heartsCount);
      btn.dataset.claimed = 'true';
      btn.innerHTML = '<span>✅</span> 출석 완료 (내일 다시 지급)';
      btn.style.background = 'rgba(255,255,255,0.1)';
      btn.style.color = '#A3B0CC';
      showToast('💖 출석 보상! 복채 하트 1개가 적립되었습니다. (현재 ' + heartsCount + '개)');
    }

    // =========================================================================
    // FLOW 02: RADAR TWEAKER
    // =========================================================================
    const radarData = {
      default: "100,35 160,80 135,150 65,150 40,80",
      fire: "100,20 160,80 135,150 65,150 40,80",
      earth: "100,35 174,75 135,150 65,150 40,80",
      water: "100,35 160,80 145,162 65,150 40,80"
    };

    function tweakRadar(type) {
      const poly = document.getElementById('radarPoly');
      const score = document.getElementById('radarScoreVal');
      if (!poly || !score) return;
      if (type === 1) {
        poly.setAttribute('points', radarData.fire);
        score.textContent = '89';
        showToast('🔥 화(火) 에너지 +10 부스팅 완료 (열정 지수 상승)');
      } else if (type === 2) {
        poly.setAttribute('points', radarData.earth);
        score.textContent = '94';
        showToast('⛰ 토(土) 에너지 +10 부스팅 완료 (신뢰 지수 상승)');
      } else if (type === 3) {
        poly.setAttribute('points', radarData.water);
        score.textContent = '82';
        showToast('💧 수(水) 에너지 +10 부스팅 완료 (소통 지수 상승)');
      } else {
        poly.setAttribute('points', radarData.default);
        score.textContent = '77';
        showToast('오행 레이더 지수가 기본값으로 초기화되었습니다.');
      }
    }

    function updateRadarValues() {
      const targetSelect = document.getElementById('radarTargetSelect');
      const label = document.getElementById('radarPartnerLabel');
      const harmonyTitle = document.getElementById('radarHarmonyTitle');
      const harmonyDesc = document.getElementById('radarHarmonyDesc');
      const score = document.getElementById('radarScoreVal');
      if (!targetSelect) return;

      if (targetSelect.value === 'gichuk') {
        if (label) label.textContent = '기축';
        if (score) score.textContent = '77';
        if (harmonyTitle) harmonyTitle.textContent = '천간합(甲己合)과 지지 육합의 길한 인연';
        if (harmonyDesc) harmonyDesc.textContent = '두 사람의 일주(Day Pillar)가 서로의 부족한 기운을 완벽하게 채워주는 조화로운 궁합입니다.';
      } else if (targetSelect.value === 'gyehae') {
        if (label) label.textContent = '계해';
        if (score) score.textContent = '96';
        if (harmonyTitle) harmonyTitle.textContent = '무계합화(戊癸合火) 천생연분 최상위 합';
        if (harmonyDesc) harmonyDesc.textContent = '음양과 오행이 완벽히 결합하여 무한한 시너지를 발생시키는 최고의 운명적 인연입니다.';
      } else {
        if (label) label.textContent = '신유';
        if (score) score.textContent = '55';
        if (harmonyTitle) harmonyTitle.textContent = '금다토약(金多土弱) 성격 차이 주의';
        if (harmonyDesc) harmonyDesc.textContent = '서로의 개성이 뚜렷하여 세심한 배려와 조율이 필요한 인연입니다.';
      }
      showToast('상대방 일주 변경에 따라 오행 케미스트리가 갱신되었습니다.');
    }

    // =========================================================================
    // FLOW 03: MATCH DYNAMIC SELECTOR
    // =========================================================================
    const matchData = {
      '계해': { score: 96, elem: '음수', mat1: '무계합화', mat2: '상생 촉진', mat3: '99.2 MHz', badge: '천생연분 우주 좌표의 만남', tip: '무토(戊土)와 계수(癸水)가 만나 화(火)의 결실을 맺는 천생연분입니다. 서로의 부족한 기운을 자연스럽게 채워줍니다.' },
      '갑자': { score: 84, elem: '양목', mat1: '목토상생', mat2: '조화 발전', mat3: '86.4 MHz', badge: '상생과 발전의 긍정적 연분', tip: '갑목의 추진력과 무토의 안정성이 만나 든든한 파트너십을 발휘하는 조화로운 인연입니다.' },
      '병인': { score: 79, elem: '양화', mat1: '화토상생', mat2: '열정 케미', mat3: '81.7 MHz', badge: '뜨거운 열정의 도파민 케미', tip: '병화의 밝은 빛이 무토의 대지를 비추어 따뜻하고 활기찬 관계를 이어갈 수 있습니다.' },
      '신유': { score: 55, elem: '음금', mat1: '토생금 과다', mat2: '배려 필요', mat3: '62.0 MHz', badge: '성격 차이 조율 및 배려 필요', tip: '서로의 가치관과 성향 차이가 발생할 수 있으므로, 경청과 배려를 통해 신뢰를 쌓아가는 것이 중요합니다.' }
    };

    function updateMatchTarget() {
      const select = document.getElementById('matchTargetSelect');
      const val = select.value;
      const data = matchData[val] || matchData['계해'];

      document.getElementById('matchBubbleName').textContent = val;
      document.getElementById('matchBubbleElem').textContent = data.elem;
      document.getElementById('matchScoreDisplay').textContent = data.score + '점';
      document.getElementById('matchMeterBar').style.width = data.score + '%';
      document.getElementById('matchBadgeText').textContent = data.badge;
      document.getElementById('matVal1').textContent = data.mat1;
      document.getElementById('matVal2').textContent = data.mat2;
      document.getElementById('matVal3').textContent = data.mat3;
      document.getElementById('matchTipContent').textContent = data.tip;

      showToast('인연 우주 주파수 매칭: ' + val + ' (' + data.score + '점)');
    }

    // =========================================================================
    // FLOW 04: 3D TAROT FLIP & VAULT
    // =========================================================================
    const tarotImages = [
      'assets/tarot_star.jpg',
      'assets/tarot_sun.jpg',
      'assets/tarot_wheel.jpg'
    ];
    const tarotFallback = [
      'app/assets/images/tarot_star.jpg',
      'app/assets/images/tarot_sun.jpg',
      'app/assets/images/tarot_wheel.jpg'
    ];

    function flipTarotCard() {
      const card = document.getElementById('tarotCard3D');
      if (!card) return;
      isFlipped = !isFlipped;
      if (isFlipped) {
        card.classList.add('flipped');
        showToast('✨ 타로 카드가 60fps 3D로 오픈되었습니다!');
      } else {
        card.classList.remove('flipped');
        showToast('카드가 뒤집혔습니다.');
      }
    }

    function pickTarot(idx, btn) {
      document.querySelectorAll('.chip-tarot').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const card = document.getElementById('tarotCard3D');
      const img = document.getElementById('tarotFrontImg');
      if (img) {
        img.src = tarotImages[idx];
        img.onerror = () => { img.src = tarotFallback[idx]; };
      }
      if (card) {
        card.classList.add('flipped');
        isFlipped = true;
      }
      showToast('타로 덱 선택 완료: ' + (btn ? btn.textContent : 'Card ' + idx));
    }

    function saveToVault() {
      showToast('🔒 256-bit AES 암호화되어 시크릿 볼트에 안전하게 보관되었습니다!');
    }

    // Fullscreen Toggle
    const btnFs = document.getElementById('btn-fullscreen');
    if (btnFs) {
      btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    }
  </script>
</body>
</html>
