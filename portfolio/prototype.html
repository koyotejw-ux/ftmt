<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070A12">
  <title>FortuneMatch (포춘매치) - 60fps Live Interactive Simulator</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --device-scale: 1;
      --gold-champagne: #E5C07B;
      --gold-bright: #FFD700;
      --gold-gradient: linear-gradient(135deg, #FFD700 0%, #E5C07B 50%, #C69C53 100%);
      --bg-deep: #070A12;
      --bg-surface: #0E1424;
      --bg-card: #151C33;
      --bg-card-hover: #1C2646;
      --cyan-neon: #00E5FF;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --violet-aurora: #8A2BE2;
      --magenta-stardust: #FF007F;
      --text-primary: #F4F6FC;
      --text-secondary: #A3B0CC;
      --text-muted: #677598;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #12182e 0%, #070a12 60%, #030408 100%);
      color: var(--text-primary);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Floating Glassmorphism Navigation Bar */
    .proto-navbar {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(14, 20, 36, 0.88);
      border-bottom: 1px solid rgba(229, 192, 123, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      flex-shrink: 0;
    }

    .proto-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back-deck {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(229, 192, 123, 0.3);
      color: var(--gold-champagne);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-deck:hover {
      background: rgba(229, 192, 123, 0.15);
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      transform: translateX(-2px);
    }

    .proto-brand {
      font-size: 14px;
      font-weight: 800;
      color: #A3B0CC;
      letter-spacing: -0.01em;
    }

    .proto-brand strong {
      color: var(--gold-bright);
    }

    /* Center Flow Switcher Pills */
    .flow-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 6px;
      border-radius: 9999px;
      border: 1px solid rgba(229, 192, 123, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .flow-pill-btn {
      background: transparent;
      border: none;
      color: #A3B0CC;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flow-pill-btn span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      font-size: 10px;
      font-weight: 800;
      color: inherit;
    }

    .flow-pill-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .flow-pill-btn.active {
      background: linear-gradient(135deg, #FFD700 0%, #E5C07B 100%);
      color: #070A12;
      box-shadow: 0 2px 14px rgba(255, 215, 0, 0.45);
      font-weight: 800;
    }

    .flow-pill-btn.active span {
      background: #070A12;
      color: #FFD700;
    }

    .proto-nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fps-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34D399;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    .fps-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-proto-pdf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      background: linear-gradient(135deg, #FFD700 0%, #E5C07B 100%);
      color: #070A12;
      font-size: 12px;
      font-weight: 800;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-proto-pdf:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.5);
      filter: brightness(1.08);
    }

    .btn-proto-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #A3B0CC;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-proto-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      transform: scale(1.05);
    }

    /* Device Stage */
    .device-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 12px 20px;
    }

    .device-scale-wrapper {
      transform: scale(var(--device-scale));
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* iPhone 16 Pro Flagship Frame */
    .iphone-device {
      width: 393px;
      height: 852px;
      background: #070A12;
      border-radius: 54px;
      box-shadow: 
        0 0 0 3px #182033,
        0 0 0 5px rgba(229, 192, 123, 0.65),
        0 25px 65px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(138, 43, 226, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Side Buttons Protrusion */
    .iphone-device::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 130px;
      width: 4px;
      height: 32px;
      background: #2D323C;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 45px 0 #2D323C, 0 95px 0 #2D323C;
    }

    .iphone-device::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 175px;
      width: 4px;
      height: 54px;
      background: #2D323C;
      border-radius: 0 2px 2px 0;
    }

    /* Authentic 44px iOS Status Bar */
    .iphone-status-bar {
      height: 44px;
      width: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      pointer-events: none;
    }

    .status-time {
      font-variant-numeric: tabular-nums;
      font-size: 14.5px;
      font-weight: 700;
      color: #F4F6FC;
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 34px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
    }

    .di-camera {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #0A0E18;
      border: 1px solid #1E293B;
      box-shadow: inset 0 0 3px rgba(0, 229, 255, 0.6);
    }

    .di-sensor {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111827;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #F4F6FC;
    }

    /* Toast Notification */
    .proto-toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(14, 20, 36, 0.95);
      border: 1px solid var(--gold-bright);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .proto-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Simulator Content Viewport */
    .simulator-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 44px;
      padding-bottom: 88px; /* Room for pinned bottom nav */
      box-sizing: border-box;
      background: #070A12;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .simulator-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Screen Views */
    .proto-screen {
      display: none;
      width: 100%;
      min-height: 100%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      position: relative;
    }

    .proto-screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* Screen Canvas & Images */
    .screen-canvas-wrap {
      position: relative;
      width: 100%;
      display: block;
      line-height: 0;
    }

    .screen-authentic-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Interactive Hotspots */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 20;
      border-radius: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .hotspot:active {
      background: rgba(255, 215, 0, 0.18);
    }

    /* Live 60fps Dual-Orbit 24-Solar Astral Wheel */
    .orbit-wheel-stage {
      position: absolute;
      top: 31.29%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 59.96%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      cursor: pointer;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 35px rgba(229, 192, 123, 0.15);
    }

    .orbit-wheel-stage:hover {
      filter: drop-shadow(0 0 24px rgba(255, 215, 0, 0.6));
    }

    .orbit-wheel-stage:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    /* Outer Ring with Golden Dash */
    .orbit-ring-outer {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1.5px dashed rgba(229, 192, 123, 0.55);
      box-shadow: 0 0 16px rgba(229, 192, 123, 0.2);
      pointer-events: none;
    }

    /* Mid Neon Cyan Orbit Ring */
    .orbit-ring-middle {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      border: 1.2px solid rgba(0, 229, 255, 0.45);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
      pointer-events: none;
    }

    /* Outer 12 Earthly Branches (Clockwise Orbit) */
    .orbit-wheel-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: spinClockwise 40s linear infinite;
      pointer-events: none;
    }

    .branch-glyph {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: #E5C07B;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      line-height: 1;
      user-select: none;
    }

    /* Inner 10 Heavenly Stems (Counter-Clockwise Orbit) */
    .orbit-wheel-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: spinCounterClockwise 32s linear infinite;
      pointer-events: none;
    }

    .stem-glyph {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      color: #00E5FF;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.75);
      line-height: 1;
      user-select: none;
    }

    /* Center Yin-Yang Core (Static Upright) */
    .orbit-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #2A1B4E 0%, #0D1224 100%);
      border: 2px solid #E5C07B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.45);
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .orbit-core span.core-yin-yang {
      font-size: 18px;
      color: #FFD700;
      line-height: 1;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    .orbit-core span.core-tag {
      font-size: 11px;
      font-weight: 900;
      color: #FFD700;
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* High-Speed Turbo Acceleration State on Tap */
    .orbit-wheel-stage.accelerating .orbit-wheel-outer {
      animation-duration: 3s !important;
    }

    .orbit-wheel-stage.accelerating .orbit-wheel-inner {
      animation-duration: 2.4s !important;
    }

    /* Specific Hotspots per Screen */
    /* Screen 01: Hub */
    .hotspot-claim-heart {
      top: 80.5%;
      left: 54%;
      width: 39%;
      height: 5.8%;
      border-radius: 20px;
    }

    .hotspot-dopamine-time {
      top: 55%;
      left: 48%;
      width: 38%;
      height: 4%;
      border-radius: 6px;
    }

    .hotspot-profile {
      top: 6.8%;
      left: 77%;
      width: 15%;
      height: 3.5%;
      border-radius: 6px;
    }

    /* Screen 02: Radar */
    .hotspot-tab-zodiac {
      top: 2.8%;
      left: 38%;
      width: 29%;
      height: 4.2%;
      border-radius: 20px;
    }

    .hotspot-share-insta {
      top: 51.5%;
      left: 65%;
      width: 28%;
      height: 4%;
      border-radius: 20px;
    }

    .hotspot-radar-chart {
      top: 64%;
      left: 20%;
      width: 60%;
      height: 22%;
      border-radius: 50%;
    }

    .hotspot-secret-report {
      top: 88.5%;
      left: 6%;
      width: 88%;
      height: 6.2%;
      border-radius: 14px;
    }

    .hotspot-calc-birth {
      top: 41.8%;
      left: 6%;
      width: 88%;
      height: 4.8%;
      border-radius: 12px;
    }

    /* Screen 03: Match */
    .hotspot-tab-saju {
      top: 3.2%;
      left: 4%;
      width: 52%;
      height: 5.5%;
      border-radius: 20px;
    }

    .hotspot-share-match {
      top: 88.5%;
      left: 50%;
      width: 42%;
      height: 5.8%;
      border-radius: 20px;
    }

    .hotspot-calc-match {
      top: 61%;
      left: 9%;
      width: 82%;
      height: 5.5%;
      border-radius: 12px;
    }

    .hotspot-load-match {
      top: 67.5%;
      left: 9%;
      width: 82%;
      height: 5.5%;
      border-radius: 12px;
    }

    /* Screen 04: Tarot */
    .hotspot-back-btn {
      top: 1.2%;
      left: 2%;
      width: 14%;
      height: 4.8%;
      border-radius: 8px;
    }

    .hotspot-share-tarot {
      top: 1.2%;
      left: 86%;
      width: 12%;
      height: 4.8%;
      border-radius: 8px;
    }

    .hotspot-tarot-card1 {
      top: 25%;
      left: 4%;
      width: 92%;
      height: 8%;
      border-radius: 12px;
    }

    .hotspot-tarot-card2 {
      top: 34%;
      left: 4%;
      width: 92%;
      height: 8%;
      border-radius: 12px;
    }

    .hotspot-tarot-card3 {
      top: 43%;
      left: 4%;
      width: 92%;
      height: 8%;
      border-radius: 12px;
    }

    /* Persistent Authentic Phone Bottom Navigation */
    .phone-bottom-nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 88px;
      z-index: 50;
      background: #070A12;
      overflow: hidden;
      border-top: 1px solid rgba(229, 192, 123, 0.2);
    }

    .bnav-authentic-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .bnav-touch-target {
      position: absolute;
      top: 0;
      bottom: 14px;
      width: 20%;
      cursor: pointer;
      z-index: 55;
      transition: background 0.15s ease;
    }

    .bnav-touch-target:active {
      background: rgba(255, 215, 0, 0.12);
    }

    /* Native iOS Home Indicator Bar */
    .home-indicator-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(229, 192, 123, 0.55);
      border-radius: 3px;
      z-index: 60;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .proto-navbar {
        padding: 0 12px;
        height: 50px;
        gap: 8px;
      }
      .proto-brand { display: none; }
      .flow-pill-group {
        overflow-x: auto;
        max-width: calc(100vw - 140px);
        scrollbar-width: none;
      }
      .flow-pill-group::-webkit-scrollbar { display: none; }
      .iphone-status-bar { display: none; }
      .device-stage { padding: 0; }
      .device-scale-wrapper {
        transform: none !important;
        width: 100%;
        height: 100%;
      }
      .iphone-device {
        width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
      .iphone-device::before, .iphone-device::after { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Glassmorphism Navigation Bar -->
  <header class="proto-navbar">
    <div class="proto-nav-left">
      <a href="index.html" class="btn-back-deck" title="포트폴리오 케이스 스터디로 돌아가기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        케이스 스터디
      </a>
      <span class="proto-brand"><strong>FortuneMatch</strong> · 60fps 인터랙티브 프로토타입</span>
    </div>

    <!-- Center Flow Switcher Pills -->
    <div class="flow-pill-group" role="tablist">
      <button class="flow-pill-btn active" id="pill-hub" onclick="switchFlow('hub')">
        <span>01</span> 우주 사주 허브
      </button>
      <button class="flow-pill-btn" id="pill-radar" onclick="switchFlow('radar')">
        <span>02</span> 오행 레이더 분석
      </button>
      <button class="flow-pill-btn" id="pill-match" onclick="switchFlow('match')">
        <span>03</span> 정밀 궁합 매칭
      </button>

  <script>
    // Live Digital Clock in Status Bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const el = document.getElementById('statusClock');
      if (el) el.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Height-Adaptive Auto-Resizing Engine for Simulator
    function autoResizeMockup() {
      const stage = document.getElementById('deviceStage');
      const wrapper = document.getElementById('deviceWrapper');
      if (!stage || !wrapper) return;
      if (window.innerWidth <= 768) {
        document.documentElement.style.setProperty('--device-scale', '1');
        return;
      }
      const availableHeight = stage.clientHeight - 28;
      const baseHeight = 852;
      let scale = Math.min(1, availableHeight / baseHeight);
      if (scale < 0.45) scale = 0.45;
      document.documentElement.style.setProperty('--device-scale', scale);
    }

    window.addEventListener('resize', autoResizeMockup);
    window.addEventListener('DOMContentLoaded', autoResizeMockup);
    autoResizeMockup();

    // Global App State
    let heartsCount = 3;

    // Toast Notification Engine
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('protoToast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    // =========================================================================
    // CORE FLOW SWITCHER (Header Pills & Bottom Nav Synced)
    // =========================================================================
    function switchFlow(flowName) {
      // 1. Update Top Pills
      document.querySelectorAll('.flow-pill-btn').forEach(b => b.classList.remove('active'));
      const activePill = document.getElementById('pill-' + flowName);
      if (activePill) activePill.classList.add('active');

      // 2. Update Screens
      document.querySelectorAll('.proto-screen').forEach(s => s.classList.remove('active'));
      const targetScreen = document.getElementById('screen-' + flowName);
      if (targetScreen) {
        targetScreen.classList.add('active');
        // Scroll viewport to top
        const viewport = document.getElementById('viewportScroll');
        if (viewport) viewport.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // 3. Update Phone Bottom Navigation Bar Image
      const bnavImg = document.getElementById('bnavImg');
      if (bnavImg) {
        if (flowName === 'hub') {
          bnavImg.src = 'assets/screens/bnav_hub.png';
        } else if (flowName === 'radar') {
          bnavImg.src = 'assets/screens/bnav_radar.png';
        } else if (flowName === 'match') {
          bnavImg.src = 'assets/screens/bnav_match.png';
        } else if (flowName === 'tarot') {
          bnavImg.src = 'assets/screens/bnav_vault.png';
        }
      }

      // Play subtle feedback toast
      showToast('화면 전환: ' + getFlowTitle(flowName));
    }

    function getFlowTitle(name) {
      if (name === 'hub') return '01. 우주 사주 허브';
      if (name === 'radar') return '02. 오행 레이더 분석';
      if (name === 'match') return '03. 정밀 인연 궁합 매칭';
      if (name === 'tarot') return '04. 럭셔리 타로 & 볼트';
      return name;
    }

    // =========================================================================
    // LIVE 60FPS DUAL-ORBIT ASTRAL COMPASS WHEEL (24-Solar Orbit Engine)
    // =========================================================================
    let astralBoostTimeout = null;
    function spinCompassFast() {
      const stage = document.getElementById('orbitWheelStage');
      if (!stage) return;
      stage.classList.add('accelerating');
      showToast('🌀 24절기 궤도 나침반 실시간 천문 좌표 정렬 완료 (陰陽 조화)');
      if (astralBoostTimeout) clearTimeout(astralBoostTimeout);
      astralBoostTimeout = setTimeout(() => {
        stage.classList.remove('accelerating');
      }, 3500);
    }

    // Daily Heart Claim
    function claimDailyHeart() {
      heartsCount += 1;
      showToast('💖 출석 보상! 복채 하트 1개가 적립되었습니다. (현재 ' + heartsCount + '개)');
    }

    // Radar Interactive Boost
    function tweakRadarInteractive() {
      showToast('🔥 오행 레이더 차트 터치: 화(火) 기운 증폭 및 케미스트리 지수 재계산 (77점 ➔ 89점)');
    }

    // Fullscreen Toggle
    const btnFs = document.getElementById('btn-fullscreen');
    if (btnFs) {
      btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    }
  </script>
